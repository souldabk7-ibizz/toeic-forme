<title>TOEIC 770 Planner</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">

<div class="app">
  <header class="app-header">
    <div class="brand">
      <span class="brand-title">TOEIC 770 Planner</span>
      <span class="brand-sub">510 → 770 · 30 min/day</span>
    </div>
    <div id="score-badge" class="score-badge"></div>
  </header>

  <nav class="tabs" id="tabs">
    <button class="tab-btn" data-tab="dashboard">วันนี้</button>
    <button class="tab-btn" data-tab="vocab">ศัพท์</button>
    <button class="tab-btn" data-tab="listening">Listening</button>
    <button class="tab-btn" data-tab="reading">Reading</button>
    <button class="tab-btn" data-tab="plan">แผน 12 สัปดาห์</button>
    <button class="tab-btn" data-tab="progress">ความคืบหน้า</button>
  </nav>

  <main>
    <section id="tab-dashboard" class="tab-panel"></section>
    <section id="tab-vocab" class="tab-panel"></section>
    <section id="tab-listening" class="tab-panel"></section>
    <section id="tab-reading" class="tab-panel"></section>
    <section id="tab-plan" class="tab-panel"></section>
    <section id="tab-progress" class="tab-panel"></section>
  </main>

  <footer class="app-footer">เปิดไฟล์นี้จากเครื่อง ข้อมูลทั้งหมดเก็บไว้ในเบราว์เซอร์ของคุณ (localStorage) ไม่มีการส่งข้อมูลออกไปที่ใด</footer>
</div>

<script src="data/vocab.js"></script>
<script src="data/listening.js"></script>
<script src="data/reading.js"></script>
<script src="data/plan.js"></script>
<script src="app.js"></script>
