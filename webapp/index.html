<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TOEIC 770 Planner</title>
<meta name="description" content="แผนและสื่อฝึก TOEIC จาก 510 สู่เป้าหมาย 770 — ศัพท์ Listening Reading พร้อมบันทึกความคืบหน้า">
<meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TOEIC 770">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="app-header">
    <div class="brand">
      <span class="brand-title">TOEIC 770 Planner</span>
      <span class="brand-sub">510 → 770 · 30 min/day</span>
    </div>
    <div class="header-right">
      <div id="score-badge" class="score-badge"></div>
      <div class="sync-box">
        <button id="sync-btn" class="btn small" type="button" style="display:none">☁︎ ล็อกอินซิงก์</button>
        <span id="sync-status" class="tiny-muted"></span>
      </div>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <button class="tab-btn" data-tab="dashboard">วันนี้</button>
    <button class="tab-btn" data-tab="vocab">ศัพท์</button>
    <button class="tab-btn" data-tab="review">ทบทวนรวม</button>
    <button class="tab-btn" data-tab="grammar">บทเรียน</button>
    <button class="tab-btn" data-tab="listening">Listening</button>
    <button class="tab-btn" data-tab="reading">Reading</button>
    <button class="tab-btn" data-tab="mock">ข้อสอบชุด</button>
    <button class="tab-btn" data-tab="plan">แผน 12 สัปดาห์</button>
    <button class="tab-btn" data-tab="progress">ความคืบหน้า</button>
  </nav>

  <main>
    <section id="tab-dashboard" class="tab-panel"></section>
    <section id="tab-vocab" class="tab-panel"></section>
    <section id="tab-review" class="tab-panel"></section>
    <section id="tab-grammar" class="tab-panel"></section>
    <section id="tab-listening" class="tab-panel"></section>
    <section id="tab-reading" class="tab-panel"></section>
    <section id="tab-mock" class="tab-panel"></section>
    <section id="tab-plan" class="tab-panel"></section>
    <section id="tab-progress" class="tab-panel"></section>
  </main>

  <footer class="app-footer">เปิดไฟล์นี้จากเครื่อง ข้อมูลทั้งหมดเก็บไว้ในเบราว์เซอร์ของคุณ (localStorage) ไม่มีการส่งข้อมูลออกไปที่ใด</footer>
</div>

<script src="data/vocab.js"></script>
<script src="data/grammar.js"></script>
<script src="data/vocablessons.js"></script>
<script src="data/listening.js"></script>
<script src="data/reading.js"></script>
<script src="data/mock.js"></script>
<script src="data/plan.js"></script>
<script src="app.js"></script>

<!-- Optional cloud sync (Firebase). Loads only on a real host; harmless if
     the config is left with placeholders. See firebase-config.js. -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="sync.js"></script>
</body>
</html>
